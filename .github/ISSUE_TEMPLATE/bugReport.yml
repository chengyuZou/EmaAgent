name: Bug report / 问题报告
description: Report a problem with Ema. / 报告 Ema 的问题.
body:
  - type: markdown
    attributes:
      value: |
        You can write in English or Chinese. / 可以使用英文或中文填写.
        Remove API keys, passwords, and private information before sharing evidence. Do not upload profile.db or your whole .ema-agent directory. / 分享前请移除 API Key, 密码和私人信息. 不要上传 profile.db 或整个 .ema-agent 目录.

  - type: input
    id: version
    attributes:
      label: Exact Ema version / Ema 完整版本号
      description: Include the full version, including any alpha or beta suffix. / 请包含 alpha 或 beta 后缀.
      placeholder: 0.1.0-beta.1
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Operating system and CPU architecture / 操作系统与 CPU 架构
      description: Include your operating system version and CPU architecture. / 请填写系统版本及 CPU 架构.
      placeholder: Windows 11 x64, macOS 15 arm64, or Ubuntu 22.04 x64
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: How do you run Ema? / 运行方式
      options:
        - Installed release package / 安装发布包
        - Run from source / 源码运行 (Dev)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Steps and problem / 复现步骤与问题
      description: Describe your steps, expected result, and actual result. / 请按顺序描述操作, 预期结果与实际结果.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Error text, screenshots, or video / 错误提示, 截图或录屏
      description: If available, share error text, screenshots, or a recording. / 如有, 请提供错误文字, 截图或录屏.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / 相关日志
      description: If available, attach relevant logs with private information removed. / 如有, 请提供已移除私人信息的相关日志.
    validations:
      required: false

  - type: input
    id: model
    attributes:
      label: Model protocol and model name / 模型协议与名称
      description: For model issues, provide the protocol and model name, without an API key. / 模型相关问题请填写协议与模型名, 不要填写 API Key.
    validations:
      required: false
