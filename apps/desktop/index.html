<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ema</title>
    <style>
      /* Transparent root — the Tauri window itself is transparent, so the
         html/body need to match or you'll see opaque rectangles. */
      html, body, #root {
        margin:           0;
        padding:          0;
        height:           100%;
        background:       transparent;
        overflow:         hidden;
        font-family:      'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        color:            #f5f5f5;
        -webkit-font-smoothing: antialiased;
      }
      /* 舞台按角色表面交互, 不选择页面文字. */
      body { user-select: none; }
    </style>
  </head>
  <body>
    <!-- Cubism Core 必须早于 Live2D 模块加载, 模块初始化时读取 window.Live2DCubismCore.
         文件由本地 public/cubism 提供, 发布时检查许可运行库的哈希, 不从 CDN 加载. -->
    <script src="/cubism/live2dcubismcore.min.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
