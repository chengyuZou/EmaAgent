[package]
name        = "ema-desktop"
version     = "0.1.0"
description = "EmaAgent desktop shell"
edition     = "2021"
rust-version = "1.77.2"

[lib]
name       = "ema_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri               = { version = "2.0", features = ["protocol-asset", "tray-icon", "unstable"] }
portable-pty         = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["process", "io-util", "fs", "macros", "rt-multi-thread", "sync", "signal", "time"] }
which              = "6"
regex              = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand                = "0.8.5"
dirs                = "6"
zip                 = { version = "2", default-features = false, features = ["deflate"] }

# Windows 进程树清理：Job Object + KILL_ON_JOB_CLOSE，Rust 进程退出时 OS 自动 kill
# 整个 Job 内子进程（server + bridge），不依赖 taskkill /T 进程树完整性。
[target.'cfg(windows)'.dependencies]
win32job = "2"
# OpenProcess 从 pid 拿进程 handle，assign 到 Job Object（win32job 只暴露 handle 接口）
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
