[project]
name = "ema-bridge"
version = "0.1.0"
description = "EmaAgent compute bridge — embedding, rerank, LightRAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",       # OpenAI-compat embed client
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "lightrag-hku>=1.3.0",  # Narrative 是 Bridge 启动时的必需模块，不再伪装成可选依赖
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",         # TestClient
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
ema-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
